AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Org-level baseline, deployed ONCE to the management account. Creates a
  multi-region organization CloudTrail (management events only) and a retained,
  encrypted, TLS-only S3 bucket to receive the logs. Covers every current and
  future member account. Management events are free; only S3 storage costs.

  Prerequisite (one-time, from the management account, no CFN resource exists):
    aws organizations enable-aws-service-access \
      --service-principal cloudtrail.amazonaws.com

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  OrgId:
    Type: String
    AllowedPattern: ^o-[a-z0-9]{10,32}$
    Description: >-
      AWS Organizations ID (e.g. "o-abcd1234ef"). Used to scope the bucket
      policy to this org's log path and to create the organization trail.

  TrailName:
    Type: String
    Default: org-trail
    Description: Name of the organization trail.

  LogRetentionDays:
    Type: Number
    Default: 400
    MinValue: 1
    Description: Days to retain CloudTrail log objects before expiry.

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # Destination bucket for CloudTrail logs. Same security posture as the
  # per-account state bucket: SSE-S3, all public access blocked, ACLs
  # disabled, retained on stack deletion so the audit trail survives.
  TrailBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub cloudtrail-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256   # SSE-S3, no KMS cost
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-logs
            Status: Enabled
            ExpirationInDays: !Ref LogRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: managed-by, Value: aws-org-bootstrap }

  # Bucket policy CloudTrail needs to write. Deliveries are scoped to this
  # org's log path; the SourceArn condition ties writes to this exact trail.
  # TLS is required for all access. The trail ARN is deterministic, so it is
  # built with !Sub rather than referencing the Trail resource (avoids a cycle).
  TrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TrailBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt TrailBucket.Arn
            Condition:
              StringEquals:
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource:
              - !Sub ${TrailBucket.Arn}/AWSLogs/${AWS::AccountId}/*
              - !Sub ${TrailBucket.Arn}/AWSLogs/${OrgId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                aws:SourceArn: !Sub arn:${AWS::Partition}:cloudtrail:${AWS::Region}:${AWS::AccountId}:trail/${TrailName}
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TrailBucket.Arn
              - !Sub ${TrailBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Multi-region organization trail. Management events only (no data-event
  # selectors), so it stays in the free tier. Log-file validation adds
  # tamper-evident digests at no cost.
  Trail:
    Type: AWS::CloudTrail::Trail
    DependsOn: TrailBucketPolicy
    Properties:
      TrailName: !Ref TrailName
      S3BucketName: !Ref TrailBucket
      IsLogging: true
      IsMultiRegionTrail: true
      IsOrganizationTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      Tags:
        - { Key: managed-by, Value: aws-org-bootstrap }

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  TrailArn:
    Description: ARN of the organization trail.
    Value: !GetAtt Trail.Arn
    Export:
      Name: !Sub ${AWS::StackName}-TrailArn
  TrailBucketName:
    Description: S3 bucket receiving CloudTrail logs.
    Value: !Ref TrailBucket
    Export:
      Name: !Sub ${AWS::StackName}-TrailBucket
