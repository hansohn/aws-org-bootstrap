AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Per-account day-0 seed. Two opt-out features (both on by default, set per
  account via StackSet parameter overrides): the GitHub Actions deploy feature
  (EnableGitHubActionsDeploy — a deploy role trusted either by the hub
  TerraformRunnerRole in the management account via role chaining
  (HubRunnerRoleArn, see hub-runner.yaml), or DIRECTLY by GitHub OIDC
  (GitHubSubjectClaims + a per-account OIDC provider), or both) and the
  Terraform state backend (EnableTerraformBackend — an S3 bucket with native
  locking, SSM self-registration, and a read-only plan role). Every account
  also gets the baseline (a monthly cost budget).

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
Parameters:
  EnableGitHubActionsDeploy:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Master switch for the GitHub Actions deploy feature (the OIDC provider
      and the deploy role GitHub assumes to apply changes). Set "false" for
      accounts that do not deploy from GitHub Actions at all — e.g. a
      security, log-archive, or centrally-managed account. They still receive
      the account baseline (budget, etc.). Override per account via StackSet
      parameter overrides.

  GitHubSubjectClaims:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      Full OIDC `sub` claim patterns allowed to assume the deploy role
      DIRECTLY (hubless model), e.g.
      "repo:hansohn/terragrunt-aws-template:ref:refs/heads/main". Wildcards
      allowed ("repo:hansohn/infra:*"). One entry per repo/environment.
      Leave blank for hub-only accounts (HubRunnerRoleArn set) — no direct
      GitHub trust, no per-account OIDC provider needed.

  HubRunnerRoleArn:
    Type: String
    Default: ""
    Description: >-
      ARN of the hub TerraformRunnerRole in the management account (the
      RunnerRoleArn output of hub-runner.yaml). When set, the deploy role
      trusts it for sts:AssumeRole (role chaining — hub model). May be
      combined with GitHubSubjectClaims to allow both trust paths during a
      migration. Ignored when EnableGitHubActionsDeploy=false.

  CreateOIDCProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the GitHub OIDC provider in this account. Set "false" if the
      account already has a token.actions.githubusercontent.com provider
      (only one is allowed per account); the deploy role still binds to it.
      Only applies when EnableGitHubActionsDeploy=true AND GitHubSubjectClaims
      is non-empty — hub-only accounts never create a provider.

  EnableTerraformBackend:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >-
      Create the Terraform state backend for this account: the S3 state
      bucket (native locking), its TLS-only bucket policy, the SSM parameter
      that advertises it, and the read-only plan role. Set "false" for
      accounts that do not run Terraform — they still get the GitHub OIDC
      provider and deploy role (generic CI) plus the account baseline, just
      no state bucket. Override per account via StackSet parameter overrides.

  DeployRoleName:
    Type: String
    Default: TerraformDeploymentRole
    Description: >-
      Name of the deploy role in this account. In the hub model this must
      match the DeployRoleName the hub-runner.yaml stack was deployed with
      (the runner's assume policy names it by convention).

  DeployRolePath:
    Type: String
    Default: /Org/
    Description: IAM path for the deploy role (must start and end with "/").
    AllowedPattern: ^/.*/$

  DeployRoleManagedPolicyArns:
    Type: CommaDelimitedList
    Default: arn:aws:iam::aws:policy/AdministratorAccess
    Description: >-
      Managed policies attached to the deploy role. Defaults to
      AdministratorAccess for a bootstrap deployer; scope this down for
      least privilege once your resource footprint is known.

  MaxSessionDurationSeconds:
    Type: Number
    Default: 3600
    MinValue: 3600
    MaxValue: 43200
    Description: >-
      Max role session length. Only reachable via direct OIDC (single hop);
      sessions arriving through the hub (role chaining) are capped at 1 hour
      by STS regardless of this value.

  PlanRoleName:
    Type: String
    Default: TerraformPlanRole
    Description: Read-only role humans assume (via SSO) for local plans.

  PlanRoleTrustedPrincipalArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >-
      IAM principal ARN patterns (ArnLike) allowed to assume the read-only
      plan role — typically your SSO permission-set roles, e.g.
      "arn:aws:iam::*:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_InfraDeveloper_*".
      Leave blank to skip the plan role (CI-only account).

  PlanRoleManagedPolicyArns:
    Type: CommaDelimitedList
    Default: arn:aws:iam::aws:policy/ReadOnlyAccess
    Description: Managed policies for the plan role. Read-only by default.

  AccountName:
    Type: String
    Default: ""
    Description: >-
      Organization account name — the display name in AWS Organizations
      (e.g. "h5n-sandbox"). Written to SSM at /org/account/name as account
      metadata; does not affect resource names. Leave blank to skip it.

  AccountAlias:
    Type: String
    Default: ""
    Description: >-
      Short account alias (e.g. "h5n-sandbox"). Drives the state bucket name
      ("<alias>-<region>-tf-state") and the budget name, and is written to SSM
      at /org/account/alias. If blank, resources fall back to account-id-based
      names and the alias parameter is skipped.

  BudgetLimitUSD:
    Type: Number
    Default: 100
    Description: Monthly cost budget threshold, in USD.

  BudgetNotificationEmail:
    Type: String
    Default: ""
    Description: Email for budget alerts. If blank, no budget is created.

  StateVersionRetentionDays:
    Type: Number
    Default: 90
    Description: Days to retain noncurrent tfstate versions before expiry.

# ---------------------------------------------------------------------------
# Conditions
# ---------------------------------------------------------------------------
Conditions:
  ShouldDeployGitHub: !Equals [!Ref EnableGitHubActionsDeploy, "true"]
  # Trust paths for the deploy role: direct GitHub OIDC (subject claims
  # supplied), the hub runner (its ARN supplied), or both.
  HasSubjectClaims: !Not [!Equals [!Join ["", !Ref GitHubSubjectClaims], ""]]
  HasHubRunner: !Not [!Equals [!Ref HubRunnerRoleArn, ""]]
  BindsOIDC: !And
    - !Condition ShouldDeployGitHub
    - !Condition HasSubjectClaims
  TrustsHub: !And
    - !Condition ShouldDeployGitHub
    - !Condition HasHubRunner
  # Create the provider only when direct OIDC trust is in play AND we are
  # not reusing a provider that already exists in the account.
  ShouldCreateOIDC: !And
    - !Condition BindsOIDC
    - !Equals [!Ref CreateOIDCProvider, "true"]
  ShouldCreateBackend: !Equals [!Ref EnableTerraformBackend, "true"]
  HasAlias: !Not [!Equals [!Ref AccountAlias, ""]]
  HasAccountName: !Not [!Equals [!Ref AccountName, ""]]
  HasBudgetEmail: !Not [!Equals [!Ref BudgetNotificationEmail, ""]]
  # The plan role reads tfstate, so it only exists when the backend does.
  HasPlanRole: !And
    - !Equals [!Ref EnableTerraformBackend, "true"]
    - !Not [!Equals [!Join ["", !Ref PlanRoleTrustedPrincipalArns], ""]]

# ---------------------------------------------------------------------------
# Resources
# ---------------------------------------------------------------------------
Resources:

  # GitHub OIDC identity provider (one per account in the hubless model).
  # AWS validates this specific IdP via its own trust store; the thumbprints
  # are required by the API but no longer used for validation.
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOIDC
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fca
      Tags:
        - { Key: managed-by, Value: aws-org-bootstrap }

  # The deploy role for this account. Trusted by the hub TerraformRunnerRole
  # (role chaining), by GitHub OIDC directly (hubless), or both.
  DeployRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployGitHub
    Properties:
      RoleName: !Ref DeployRoleName
      Path: !Ref DeployRolePath
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      ManagedPolicyArns: !Ref DeployRoleManagedPolicyArns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          # Hub model: the management account's runner role chains in.
          - !If
            - TrustsHub
            - Effect: Allow
              Action: sts:AssumeRole
              Principal:
                AWS: !Ref HubRunnerRoleArn
            - !Ref AWS::NoValue
          # Hubless model: GitHub Actions assumes the role directly.
          - !If
            - BindsOIDC
            - Effect: Allow
              Action: sts:AssumeRoleWithWebIdentity
              Principal:
                # Reference the resource when we create it (adds ordering),
                # otherwise bind to the deterministic pre-existing ARN.
                Federated: !If
                  - ShouldCreateOIDC
                  - !Ref GitHubOIDCProvider
                  - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
              Condition:
                StringEquals:
                  token.actions.githubusercontent.com:aud: sts.amazonaws.com
                StringLike:
                  token.actions.githubusercontent.com:sub: !Ref GitHubSubjectClaims
            - !Ref AWS::NoValue
      Tags:
        - { Key: managed-by, Value: aws-org-bootstrap }

  # Read-only role humans assume (via their SSO permission set) to run local
  # plans that match CI. Created only when trusted principals are supplied.
  PlanRole:
    Type: AWS::IAM::Role
    Condition: HasPlanRole
    Properties:
      RoleName: !Ref PlanRoleName
      Path: !Ref DeployRolePath
      MaxSessionDuration: !Ref MaxSessionDurationSeconds
      ManagedPolicyArns: !Ref PlanRoleManagedPolicyArns
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Condition:
              # Wildcard-friendly: SSO role ARNs carry a random suffix.
              ArnLike:
                aws:PrincipalArn: !Ref PlanRoleTrustedPrincipalArns
      Policies:
        # Guarantee state access regardless of the managed policy choice:
        # read the state object and acquire/release the native S3 lock.
        - PolicyName: terraform-state-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadState
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt StateBucket.Arn
                  - !Sub ${StateBucket.Arn}/*
              - Sid: StateLock
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub ${StateBucket.Arn}/*.tflock
      Tags:
        - { Key: managed-by, Value: aws-org-bootstrap }

  # Terraform/Terragrunt S3 backend bucket. Native S3 locking (use_lockfile),
  # so no DynamoDB table. Never auto-deleted with the stack.
  StateBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateBackend
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - HasAlias
        - !Sub ${AccountAlias}-${AWS::Region}-tf-state
        - !Sub ${AWS::AccountId}-${AWS::Region}-tf-state
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256   # SSE-S3, no KMS cost
            BucketKeyEnabled: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-state
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: !Ref StateVersionRetentionDays
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - { Key: managed-by, Value: aws-org-bootstrap }

  # Deny any non-TLS access to the state bucket.
  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldCreateBackend
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub ${StateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Self-registration: expose the backend coordinates via SSM so Terragrunt
  # can read them instead of hardcoding names.
  SsmStateBucket:
    Type: AWS::SSM::Parameter
    Condition: ShouldCreateBackend
    Properties:
      Name: /org/tf/state-bucket
      Type: String
      Value: !Ref StateBucket
      Tags:
        managed-by: aws-org-bootstrap

  SsmDeployRoleArn:
    Type: AWS::SSM::Parameter
    Condition: ShouldDeployGitHub
    Properties:
      Name: /org/tf/deploy-role-arn
      Type: String
      Value: !GetAtt DeployRole.Arn
      Tags:
        managed-by: aws-org-bootstrap

  SsmAccountName:
    Type: AWS::SSM::Parameter
    Condition: HasAccountName
    Properties:
      Name: /org/account/name
      Type: String
      Value: !Ref AccountName
      Tags:
        managed-by: aws-org-bootstrap

  SsmAccountAlias:
    Type: AWS::SSM::Parameter
    Condition: HasAlias
    Properties:
      Name: /org/account/alias
      Type: String
      Value: !Ref AccountAlias
      Tags:
        managed-by: aws-org-bootstrap

  # Monthly cost guard (global service; near-zero cost — 2 budgets free).
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: HasBudgetEmail
    Properties:
      Budget:
        BudgetName: !If [HasAlias, !Sub "${AccountAlias}-monthly", account-monthly]
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetLimitUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetNotificationEmail

# ---------------------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------------------
Outputs:
  DeployRoleArn:
    Condition: ShouldDeployGitHub
    Description: >-
      Deploy role ARN. Hub model: the runner derives this by convention —
      nothing to configure in GitHub. Hubless: set it as a repo/environment
      variable for configure-aws-credentials.
    Value: !GetAtt DeployRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DeployRoleArn
  StateBucketName:
    Condition: ShouldCreateBackend
    Description: Terraform/Terragrunt S3 backend bucket.
    Value: !Ref StateBucket
    Export:
      Name: !Sub ${AWS::StackName}-StateBucket
  OIDCProviderArn:
    Condition: BindsOIDC
    Description: GitHub OIDC provider ARN (created or pre-existing).
    Value: !If
      - ShouldCreateOIDC
      - !Ref GitHubOIDCProvider
      - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
  PlanRoleArn:
    Condition: HasPlanRole
    Description: Read-only role for local plans (chain SSO -> this role).
    Value: !GetAtt PlanRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-PlanRoleArn
